
name: Student CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Project Files
        run: ls

      - name: Check HTML File
        run: test -f index.html

      - name: Check CSS File
        run: test -f style.css

      - name: Success Message
        run: echo "Student Project Successfully Tested!"
